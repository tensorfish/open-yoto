<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Install openyoto web UI</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151922;--line:#2a3140;--text:#f2f4f8;--muted:#929bad;--accent:#f4a62a;--error:#ef5b62;--ok:#43c985}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#111722,#0b0d12);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}h1{font-size:20px;margin:0 0 6px}.hint{color:var(--muted);margin:0 0 16px}label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}input{width:100%;min-height:44px;margin:0 0 12px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#0d1118;color:var(--text);font:inherit}input:focus{outline:2px solid #f4a62a55;border-color:var(--accent)}button{min-height:44px;border:0;border-radius:9px;padding:8px 14px;background:var(--accent);color:#241600;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.status{min-height:22px;margin:12px 0 0;color:var(--muted)}.status.err{color:var(--error)}.status.ok{color:var(--ok)}[hidden]{display:none!important}
</style>
<main class="card"><section id="login"><h1>Install web UI</h1><p class="hint">Enter the six-character access code shown on the player.</p><label for="pin">Access code</label><input id="pin" maxlength="6" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="A1B2C3"><button id="unlock">Continue</button></section><section id="upload" hidden><h1>Update web UI</h1><p class="hint">Upload one <code>index.html</code>. It will be served from the SD card whenever you open this address.</p><label for="file">index.html</label><input id="file" type="file" accept="text/html,.html"><button id="install" disabled>Upload web UI</button></section><p class="status" id="status" role="status" aria-live="polite"></p></main>
<script>
const $=s=>document.querySelector(s);function status(text,kind=''){const e=$('#status');e.textContent=text;e.className='status '+kind}async function login(){const pin=$('#pin').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(pin)){status('Enter all six letters and numbers.','err');return}status('Checking access code...');try{const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});if(r.status===401){status('Invalid access code.','err');return}if(!r.ok)throw new Error('login failed');$('#login').hidden=true;$('#upload').hidden=false;status('Choose the index.html file to install.','ok')}catch(e){status('Unable to unlock installer: '+e.message,'err')}}async function install(){const file=$('#file').files[0];if(!file)return;const button=$('#install');button.disabled=true;status('Uploading web UI...');try{const r=await fetch('/api/webui/upload',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'text/html'},body:file});if(!r.ok)throw new Error((await r.text())||('HTTP '+r.status));status('Web UI installed. Opening it now...','ok');location.replace('/')}catch(e){status('Upload failed: '+e.message,'err');button.disabled=false}}$('#unlock').onclick=login;$('#pin').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');$('#pin').onkeydown=e=>{if(e.key==='Enter')login()};$('#file').onchange=()=>{$('#install').disabled=!$('#file').files.length};$('#install').onclick=install;
</script>
</html>
