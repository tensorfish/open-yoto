<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>openyoto admin</title>
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e6e9ef;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#8b93a3;font-size:13px;margin:0 0 20px}
.card{background:#181b22;border:1px solid #2a2f3a;border-radius:12px;padding:16px;margin:0 0 16px}
.card h2{font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.08em;color:#8b93a3}
label{display:block;font-size:12px;color:#8b93a3;margin:0 0 4px}
input{width:100%;min-height:46px;padding:10px 12px;border:1px solid #2a2f3a;border-radius:8px;background:#10131a;color:#e6e9ef;margin:0 0 12px;font-size:16px}
button{min-height:46px;background:#f5a623;color:#201503;border:0;border-radius:8px;padding:10px 16px;font-size:16px;font-weight:600;cursor:pointer;touch-action:manipulation}
button.ghost{background:transparent;border:1px solid #2a2f3a;color:#e6e9ef}
button.danger{color:#e5484d}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #2a2f3a}
.item:last-child{border-bottom:0}
.item .u{font-size:13px;word-break:break-all;flex:1}
.item .thumb{width:48px;height:48px;object-fit:cover;border-radius:6px;background:#000;flex:none}
.hint{color:#8b93a3;font-size:12px}
.warn{color:#f5a623;font-size:12px;margin:0 0 12px}
.pv{display:inline-flex;flex-direction:column;align-items:center;gap:4px;margin:0 8px 12px 0}
.pv-canvas{image-rendering:pixelated;background:#000;border:1px solid #2a2f3a;border-radius:6px}
.pv-name{font-size:11px;color:#8b93a3;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:8px;margin:0 0 16px}
.tab{flex:1;background:#181b22;border:1px solid #2a2f3a;color:#8b93a3;border-radius:8px;min-height:40px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer}
.tab.active{background:#f5a623;color:#201503;border-color:#f5a623}
#status{margin-top:12px;font-size:13px;min-height:18px}
#status.ok{color:#2fbf71}
#status.err{color:#e5484d}
</style>
</head>
<body>
<div class='wrap'>
<h1>openyoto admin</h1>
<p class='sub'>SoftAP content manager</p>
<div class='card' id='unlockCard'>
<h2>Access code</h2>
<p class='hint'>Enter the 4-digit code shown on the player to unlock changes.</p>
<input id='pin' type='password' maxlength='4' inputmode='numeric' pattern='[0-9]*' placeholder='0000'>
<button id='unlock'>Unlock</button>
</div>
<div id='appSection' style='display:none'>
<div class='tabs'>
<button class='tab active' id='tabNew'>New</button>
<button class='tab' id='tabBrowse'>Browse</button>
</div>
<div class='card' id='addCard'>
<h2>Add content</h2>
<label for='url'>Card URL (NFC tag target)</label>
<input id='url' type='text' placeholder='https://example.com/card'>
<p id='cardwarn' class='warn' style='display:none'></p>
<label for='files'>Select a folder (.mp3 + images, paired by name)</label>
<input id='files' type='file' webkitdirectory multiple>
<p id='filesummary' class='hint'></p>
<div id='previews'></div>
<button id='add' disabled>Add content</button>
</div>
<div class='card' id='browseCard'>
<h2>Content</h2>
<div id='list'><p class='hint'>Loading...</p></div>
</div>
</div>
<p id='status'></p>
<audio id='player' preload='none'></audio>
</div>
<script>
function q(s){return document.querySelector(s)}
var unlocked=false;
function pin(){return q('#pin').value.trim()}
function setStatus(t,c){var e=q('#status');e.textContent=t;e.className=c||''}
function showTab(name){
  var add=name==='new';
  q('#tabNew').className='tab'+(add?' active':'');
  q('#tabBrowse').className='tab'+(add?'':' active');
  q('#addCard').style.display=add?'block':'none';
  q('#browseCard').style.display=add?'none':'block';
}
async function unlock(){
  var p=pin();
  if(!p){setStatus('Enter the access code first.','err');return}
  setStatus('Unlocking...','');
  try{
    var r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:p})});
    if(r.ok){
      unlocked=true;
      q('#unlockCard').style.display='none';
      q('#appSection').style.display='block';
      showTab('new');
      q('#add').disabled=false;
      load();
      setStatus('Unlocked.','ok');
    }else{
      setStatus(r.status===401?'Wrong code.':'Unlock failed ('+r.status+')','err');
    }
  }catch(e){setStatus('Unlock failed: '+e,'err')}
}
function firstSound(it){
  if(it.tracks&&it.tracks.length){return it.tracks[0]}
  return it.sound
}
function renderBitmap(cv,bytes,scale){
  var tmp=document.createElement('canvas');
  tmp.width=16;tmp.height=16;
  var tg=tmp.getContext('2d');
  var img=tg.createImageData(16,16);
  for(var y=0;y<16;y++){
    for(var x=0;x<16;x++){
      if((bytes[y*2+(x>>3)]>>(7-(x&7)))&1){
        var i=(y*16+x)*4;
        img.data[i]=img.data[i+1]=img.data[i+2]=img.data[i+3]=255;
      }
    }
  }
  tg.putImageData(img,0,0);
  cv.width=16*scale;cv.height=16*scale;
  var g=cv.getContext('2d');
  g.imageSmoothingEnabled=false;
  g.drawImage(tmp,0,0,cv.width,cv.height);
}
function drawPlaceholder(cv){
  cv.width=48;cv.height=48;
  var g=cv.getContext('2d');
  g.fillStyle='#161a21';
  g.fillRect(0,0,48,48);
  g.strokeStyle='#3a4150';
  g.lineWidth=2;
  g.beginPath();g.moveTo(14,14);g.lineTo(34,34);g.moveTo(34,14);g.lineTo(14,34);g.stroke();
}
async function loadThumb(cv,path){
  var name=path.split('/').pop();
  try{
    var r=await fetch('/media/'+name);
    if(!r.ok){drawPlaceholder(cv);return}
    var buf=await r.arrayBuffer();
    if(buf.byteLength<32){drawPlaceholder(cv);return}
    renderBitmap(cv,new Uint8Array(buf),3);
  }catch(e){drawPlaceholder(cv)}
}
var player=q('#player');
var currentTrack=null;
function setPlayButtons(){
  var bs=document.querySelectorAll('button.play');
  for(var i=0;i<bs.length;i++){bs[i].textContent='Play'}
}
function toggleSound(it,btn){
  var s=firstSound(it);
  if(!s){setStatus('No sound for this card.','err');return}
  var src='/media/'+s.split('/').pop();
  if(currentTrack===src&&!player.paused){player.pause();btn.textContent='Play';return}
  setPlayButtons();
  if(currentTrack!==src){player.src=src;currentTrack=src}
  var p=player.play();
  if(p&&p.catch){p.catch(function(){setStatus('Playback failed.','err')})}
  btn.textContent='Pause';
}
player.addEventListener('ended',setPlayButtons);
async function load(){
  var r=await fetch('/api/list');
  var items=await r.json();
  var el=q('#list');
  el.innerHTML='';
  if(!items.length){el.innerHTML='<p class=hint>No content yet.</p>';return}
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var d=document.createElement('div');
    d.className='item';
    var cv=document.createElement('canvas');
    cv.className='thumb';
    cv.width=48;cv.height=48;
    d.appendChild(cv);
    if(it.image){loadThumb(cv,it.image)}else{drawPlaceholder(cv)}
    var u=document.createElement('div');
    u.className='u';
    var count=(it.tracks&&it.tracks.length)?it.tracks.length:(it.sound?1:0);
    u.textContent=count>0?(it.url+' ('+count+' track'+(count===1?'':'s')+')'):it.url;
    d.appendChild(u);
    var p=document.createElement('button');
    p.className='ghost play';
    p.textContent='Play';
    p.onclick=(function(entry,btn){return function(){toggleSound(entry,btn)}})(it,p);
    d.appendChild(p);
    var b=document.createElement('button');
    b.className='ghost danger';
    b.textContent='Delete';
    b.onclick=(function(entry){return function(){del(entry)}})(it.url);
    b.disabled=!unlocked;
    d.appendChild(b);
    el.appendChild(d);
  }
}
function scaleTo16x16Bitmap(file,cb){
  var img=new Image();
  var url=URL.createObjectURL(file);
  img.onload=function(){
    URL.revokeObjectURL(url);
    var c=document.createElement('canvas');
    c.width=16;c.height=16;
    var g=c.getContext('2d');
    g.drawImage(img,0,0,16,16);
    var d=g.getImageData(0,0,16,16).data;
    var bytes=new Uint8Array(32);
    for(var y=0;y<16;y++){
      var b0=0;var b1=0;
      for(var x=0;x<8;x++){
        var i=(y*16+x)*4;
        var l=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        if(l>128){b0|=1<<(7-x)}
        var j=i+32;
        var l2=0.299*d[j]+0.587*d[j+1]+0.114*d[j+2];
        if(l2>128){b1|=1<<(7-x)}
      }
      bytes[y*2]=b0;bytes[y*2+1]=b1;
    }
    cb(bytes);
  };
  img.onerror=function(){URL.revokeObjectURL(url);cb(null)};
  img.src=url;
}
var lastSeq=null;
function showCardWarn(msg){
  var e=q('#cardwarn');
  if(msg){e.textContent=msg;e.style.display='block'}
  else{e.style.display='none'}
}
async function pollLastCard(){
  try{
    var r=await fetch('/api/last-card');
    if(!r.ok){return}
    var d=await r.json();
    if(d.url&&d.seq!==lastSeq){
      lastSeq=d.seq;
      q('#url').value=d.url;
      showCardWarn(d.exists?'This card already has content - adding will replace it.':'');
    }
  }catch(e){}
}
var selectedTracks=[];
var AUDIO_EXTS=['.mp3'];
var IMAGE_EXTS=['.png','.jpg','.jpeg','.gif','.bmp','.webp','.img'];
function fileExt(n){var i=n.lastIndexOf('.');return i>=0?n.slice(i).toLowerCase():''}
function fileBase(n){var i=n.lastIndexOf('.');return (i>=0?n.slice(0,i):n).toLowerCase()}
function isAudio(n){return AUDIO_EXTS.indexOf(fileExt(n))>=0}
function isImage(n){return IMAGE_EXTS.indexOf(fileExt(n))>=0}
function clearPreviews(){
  var el=q('#previews');el.innerHTML='';
  q('#filesummary').textContent='';
  selectedTracks=[];
}
async function buildPlaylist(files){
  var audios=[];var imgs={};
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(isAudio(f.name)){audios.push(f)}
    else if(isImage(f.name)){imgs[fileBase(f.name)]=f}
  }
  audios.sort(function(a,b){return a.name<b.name?-1:(a.name>b.name?1:0)});
  var tracks=[];
  for(var j=0;j<audios.length;j++){
    var a=audios[j];
    var img=imgs[fileBase(a.name)]||null;
    var bmp=null;
    if(img){bmp=await new Promise(function(res){scaleTo16x16Bitmap(img,res)})}
    tracks.push({audio:a,image:img,bitmap:bmp,name:fileBase(a.name)});
  }
  return tracks;
}
function renderPreviews(tracks){
  var el=q('#previews');el.innerHTML='';
  var n=0;
  for(var i=0;i<tracks.length;i++){
    var t=tracks[i];
    if(!t.bitmap){continue}
    n++;
    var d=document.createElement('div');d.className='pv';
    var cv=document.createElement('canvas');cv.width=64;cv.height=64;cv.className='pv-canvas';
    renderBitmap(cv,t.bitmap,4);
    var cap=document.createElement('span');cap.className='pv-name';cap.textContent=t.name;
    d.appendChild(cv);d.appendChild(cap);el.appendChild(d);
  }
  q('#filesummary').textContent=tracks.length+' track'+(tracks.length===1?'':'s')+' ('+n+' with image'+(n===1?'':'s')+')';
}
async function add(){
  if(!unlocked){setStatus('Enter the access code first.','err');return}
  var u=q('#url').value.trim();
  if(!u){setStatus('Enter a card URL first.','err');return}
  var tracks=selectedTracks;
  if(!tracks.length){setStatus('Choose audio files.','err');return}
  var manifest=[];
  var fd=new FormData();
  fd.append('url',u);
  for(var i=0;i<tracks.length;i++){
    var t=tracks[i];
    var audioName=t.audio.name;
    var imageName=t.bitmap?(t.name+'.img'):'';
    manifest.push({s:audioName,i:imageName});
    fd.append('sound',t.audio,audioName);
    if(t.bitmap){fd.append('image',new Blob([t.bitmap],{type:'application/octet-stream'}),imageName)}
  }
  fd.append('manifest',JSON.stringify(manifest));
  setStatus('Uploading...','');
  try{
    var r=await fetch('/api/add',{method:'POST',credentials:'same-origin',body:fd});
    if(r.ok){setStatus('Added '+u,'ok');q('#url').value='';q('#files').value='';clearPreviews();showCardWarn('');load()}
    else{setStatus('Add failed ('+r.status+')','err')}
  }catch(e){setStatus('Add failed: '+e,'err')}
}
async function del(u){
  if(!unlocked){setStatus('Enter the access code first.','err');return}
  if(!confirm('Delete '+u+'?')){return}
  var r=await fetch('/api/delete',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});
  if(r.ok){setStatus('Deleted '+u,'ok');load()}
  else{setStatus('Delete failed ('+r.status+')','err')}
}
q('#unlock').onclick=unlock;
q('#add').onclick=add;
q('#files').addEventListener('change',async function(){
  var files=q('#files').files;
  if(!files.length){clearPreviews();return}
  var tracks=await buildPlaylist(files);
  selectedTracks=tracks;
  renderPreviews(tracks);
});
q('#tabNew').onclick=function(){showTab('new')};
q('#tabBrowse').onclick=function(){showTab('browse')};
q('#url').addEventListener('input',function(){showCardWarn('')});
pollLastCard();
setInterval(pollLastCard,2000);
</script>
</body>
</html>
