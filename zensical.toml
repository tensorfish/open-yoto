      { "Post-Flash Setup" = "firmware/post-flash-setup.md" },
      { "How It Works" = "open-yoto-firmware.md" },
      { "Build Environment" = "build-setup.md" },
  ]},
  { "Reverse Engineering" = [
      { "Overview" = "reverse-engineering.md" },
      { "Subsystems" = [
          { "Overview" = "subsystems/index.md" },
          { "NFC / RFID (CR95HF)" = "subsystems/nfc.md" },
          { "SD Card & Storage" = "subsystems/storage.md" },
          { "Display" = "subsystems/display.md" },
          { "Audio" = "subsystems/audio.md" },
          { "Power & Battery" = "subsystems/power.md" },
          { "Wi-Fi & Bluetooth" = "subsystems/connectivity.md" },
          { "Boot & OTA" = "subsystems/boot.md" },
      ]},
      { "Reference" = [
          { "Overview" = "reference/index.md" },
          { "Hardware & Ports" = "hardware.md" },
          { "Firmware Analysis" = "decompile.md" },
          { "Methodology" = "methodology.md" },
      ]},
  ]},
  { "Research" = [
      { "Overview" = "ai/index.md" },
      { "Firmware Analysis Workflow" = "ai/decompile.md" },
      { "Subsystems" = [
          { "Overview" = "ai/subsystems/index.md" },
          { "NFC" = "ai/nfc.md" },
          { "Storage" = "ai/storage.md" },
          { "Display" = "ai/display.md" },
          { "Audio" = "ai/audio.md" },
          { "Power" = "ai/power.md" },
          { "Connectivity" = "ai/connectivity.md" },
          { "Boot" = "ai/boot.md" },
      ]},
  ]},
]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

